---
- name: Install and configure k3s Server
  hosts: k3s_server
  become: yes
  tasks:
    - name: Create k3s config directory
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    # 내장 Cloud Controller Manager가 노드를 먼저 초기화하면 providerID를 바꿀 수 없으므로
    # 설정 파일은 반드시 k3s를 설치하기 전에 만들어 둡니다.
    - name: Create k3s config file
      copy:
        content: |
          write-kubeconfig-mode: "0644"

          tls-san:
            - "{{ public_ip_address }}"

          # AWS Cloud Controller Manager는 노드 이름으로 EC2 인스턴스를 찾으므로 Private DNS 이름과 맞춥니다.
          node-name: "{{ private_dns_name }}"

          # 내장 Cloud Controller Manager 대신 AWS Cloud Controller Manager를 사용합니다.
          disable-cloud-controller: true
          kubelet-arg:
            - cloud-provider=external

          # ServiceLB, Traefik 대신 AWS Load Balancer Controller(NLB, ALB)를 사용합니다.
          disable:
            - servicelb
            - traefik
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      register: k3s_config

    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -s - server
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      args:
        creates: /usr/local/bin/k3s-uninstall.sh
      register: k3s_install

    - name: Restart k3s service when config file is changed
      systemd:
        name: k3s
        state: restarted
      when: k3s_config.changed and not k3s_install.changed

    # manifests 디렉터리에 둔 파일은 k3s가 자동으로 클러스터에 배포합니다.
    - name: Deploy AWS Cloud Controller Manager and AWS Load Balancer Controller
      template:
        src: "{{ item }}.yaml.j2"
        dest: "/var/lib/rancher/k3s/server/manifests/{{ item }}.yaml"
        mode: '0600'
      loop:
        - aws-cloud-controller-manager
        - aws-load-balancer-controller

    - name: Get k3s node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Set k3s token as fact
      set_fact:
        k3s_node_token: "{{ k3s_token.content | b64decode | trim }}"

    - name: Fetch kubeconfig file
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./kubeconfig-k3s-aws-lbc.yaml
        flat: yes

    - name: Replace localhost with public IP in kubeconfig
      become: no
      delegate_to: localhost
      replace:
        path: ./kubeconfig-k3s-aws-lbc.yaml
        regexp: '127\.0\.0\.1'
        replace: "{{ public_ip_address }}"

- name: Install k3s Agent
  hosts: k3s_agent
  become: yes
  tasks:
    - name: Create k3s config directory
      file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0755'

    - name: Create k3s config file
      copy:
        content: |
          node-name: "{{ private_dns_name }}"

          kubelet-arg:
            - cloud-provider=external
        dest: /etc/rancher/k3s/config.yaml
        mode: '0644'
      register: k3s_config

    - name: Install k3s
      shell: curl -sfL https://get.k3s.io | sh -
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "https://{{ hostvars[groups['k3s_server'][0]]['private_ip_address'] }}:6443"
        K3S_TOKEN: "{{ hostvars[groups['k3s_server'][0]]['k3s_node_token'] }}"
      args:
        creates: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_install

    - name: Restart k3s-agent service when config file is changed
      systemd:
        name: k3s-agent
        state: restarted
      when: k3s_config.changed and not k3s_install.changed

- name: Verify AWS Cloud Controller Manager and AWS Load Balancer Controller
  hosts: k3s_server
  become: yes
  tasks:
    # AWS Load Balancer Controller는 providerID로 노드의 인스턴스 ID를 알아냅니다.
    - name: Wait for AWS Cloud Controller Manager to set providerID on all nodes
      command: /usr/local/bin/k3s kubectl get nodes --no-headers -o custom-columns=PROVIDER_ID:.spec.providerID
      register: provider_ids
      until: provider_ids.stdout_lines | select('match', '^aws:///') | list | length == groups['all'] | length
      retries: 30
      delay: 10
      changed_when: false

    - name: Wait for AWS Load Balancer Controller to be ready
      command: /usr/local/bin/k3s kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=10s
      register: lbc_rollout
      until: lbc_rollout.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Get nodes
      command: /usr/local/bin/k3s kubectl get nodes -o wide
      register: k3s_nodes
      changed_when: false

    - name: Show nodes
      debug:
        var: k3s_nodes.stdout_lines
